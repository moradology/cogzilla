[package]
name = "cogzilla-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gpu"]
gpu = ["dep:cogzilla-gpu"]

[dependencies]
cogzilla-raster = { path = "../cogzilla-raster" }
cogzilla-tiff = { path = "../cogzilla-tiff" }
cogzilla-codec = { path = "../cogzilla-codec" }
cogzilla-proj = { path = "../cogzilla-proj" }
cogzilla-kernel = { path = "../cogzilla-kernel" }
cogzilla-io = { path = "../cogzilla-io" }
cogzilla-zarr = { path = "../cogzilla-zarr" }
cogzilla-pgstac = { path = "../cogzilla-pgstac" }
cogzilla-gpu = { path = "../cogzilla-gpu", optional = true }
thiserror.workspace = true
bytes.workspace = true
dashmap.workspace = true
ahash.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
futures-util.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
mimalloc = { version = "0.1", default-features = false }

[[example]]
name = "e2e_realistic_workload_bench"
required-features = ["gpu"]

[[example]]
name = "gpu_torture_test"
required-features = ["gpu"]

[dev-dependencies]
libdeflater.workspace = true
tokio-postgres.workspace = true
zune-jpeg.workspace = true

[lints]
workspace = true

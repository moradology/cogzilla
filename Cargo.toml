[workspace]
resolver = "2"
members = [
    "crates/cogzilla-raster",
    "crates/cogzilla-tiff",
    "crates/cogzilla-codec",
    "crates/cogzilla-proj",
    "crates/cogzilla-kernel",
    "crates/cogzilla-gpu",
    "crates/cogzilla-io",
    "crates/cogzilla-zarr",
    "crates/cogzilla-pgstac",
    "crates/cogzilla-server",
    "crates/cogzilla-lambda",
    "benches/cogmark",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
# SIMD kernels, raster resamplers, and multi-band tile helpers routinely take
# >7 parameters, use index-based tight loops, or return nested tuple/future types.
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[workspace.dependencies]
thiserror = "2"
bytes = "1"
crc32fast = "1"
libdeflater = "1.22"
brotli = { version = "8", default-features = false, features = ["std"] }
zstd-sys = "2"
libwebp-sys = "0.11"
mozjpeg = { version = "0.10", default-features = false, features = ["nasm_simd", "parallel"] }
zune-jpeg = "0.4"
lerc-core = "=0.5.2"
lerc-reader = { version = "=0.5.2", default-features = false }
memmap2 = "0.9"
dashmap = "6"
parking_lot = "0.12"
ahash = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto", "server-graceful", "client-legacy"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lambda_http = { version = "0.14", default-features = false, features = ["apigw_http", "apigw_rest", "alb"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
